name: Live Test

on:
  workflow_dispatch:
    inputs:
      vanity:
        description: 'Vanity URL to claim (overrides config default)'
        required: false
        type: string

env:
  GUILD_ID: ${{ secrets.GUILD_ID }}
  VANITY: ${{ github.event.inputs.vanity || secrets.VANITY }}
  TOKEN: ${{ secrets.TOKEN }}

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create config.json from secrets
        run: |
          cat > config.json << CONFIGEOF
          {
            "webhook_url": "${{ secrets.WEBHOOK_URL }}",
            "totp_secret": "${{ secrets.TOTP_SECRET }}",
            "password": "${{ secrets.PASSWORD }}",
            "email": "${{ secrets.EMAIL }}",
            "backup_codes": [],
            "burst_count": 3,
            "warm_connections": 3,
            "session_path": "session_state.json",
            "guard_mode": false,
            "targets": [
              {
                "guild_id": "${GUILD_ID}",
                "vanity": "${VANITY}",
                "token": "${TOKEN}",
                "password": "${{ secrets.PASSWORD }}",
                "proxies": [""]
              }
            ],
            "browser": "firefox"
          }
          CONFIGEOF
      - name: Run live claim test
        run: go test -tags=live -run=TestLiveClaim -v -timeout=120s
      - name: Upload session state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-state
          path: session_state.json

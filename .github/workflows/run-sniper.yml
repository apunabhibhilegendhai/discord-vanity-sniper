name: Run sniper (Actions-hosted)

# The sniper configuration lives in Supabase, not in GitHub Actions secrets.
# `sniper_configs` holds the versioned document (targets, tokens, Vanity Guard
# settings); only the infrastructure credentials needed to reach Supabase are
# stored as repository secrets:
#
#   SUPABASE_URL               the instance base URL
#   SUPABASE_SERVICE_ROLE_KEY  server-side key; RLS denies anon and authenticated
#
# `deploy/bin/sniper-config-push` writes a new active version, and the dashboard
# does the same through public.sniper_save_config().
#
# GitHub-hosted jobs are capped at six hours and the VM is destroyed at the end,
# so this runs a bounded session and dispatches its own successor. That chain is
# not equivalent to systemd on an always-on host: every session is a fresh VM,
# warm TLS pools and the gateway sequence are rebuilt, and there is a gap while
# the next job queues and arms. Use deploy-sniper.yml on a `sniper-host` runner
# for a genuinely always-on sniper.

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Minutes to run before chaining the next session (max 350)"
        required: false
        default: "345"
  schedule:
    # Watchdog: starts a session every 6 hours if the chain ever breaks.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  # One session at a time. The successor is dispatched just before this job
  # exits, so it waits here instead of racing the running sniper.
  group: sniper-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write # required to dispatch the next session

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build sniper
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ./sniper .
          ls -l ./sniper

      - name: Fetch active config from Supabase
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          : "${SUPABASE_URL:?missing SUPABASE_URL repository secret}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?missing SUPABASE_SERVICE_ROLE_KEY repository secret}"
          url="${SUPABASE_URL%/}"

          if ! resp="$(curl -fsS --max-time 20 \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H 'Accept: application/json' \
              "${url}/rest/v1/sniper_configs?select=version,config&active=eq.true&order=version.desc&limit=1")"; then
            echo "::error::could not read sniper_configs from ${url} (is supabase/migrations/0001_dashboard.sql applied?)"
            exit 1
          fi

          version="$(printf '%s' "$resp" | jq -r '.[0].version // empty')"
          if [ -z "$version" ]; then
            echo "::error::No active row in sniper_configs. Save a config through the dashboard or run deploy/bin/sniper-config-push; sniper config does not belong in Actions secrets."
            exit 1
          fi

          umask 077
          printf '%s' "$resp" | jq -e '.[0].config' > config.json
          chmod 0600 config.json
          if ! jq -e 'type == "object" and has("targets") and (.targets | type == "array") and (.targets | length > 0)' \
              config.json >/dev/null; then
            echo "::error::active config version ${version} is not a valid config document (needs a non-empty targets array)"
            exit 1
          fi

          # The repository is public, so its Action logs are public. Log only
          # non-identifying shape: never a vanity, guild id, proxy, or token.
          echo "config version ${version}: $(jq -r '.targets | length' config.json) target(s), burst_count=$(jq -r '.burst_count // 5' config.json), guard_mode=$(jq -r '.guard_mode // false' config.json), guard_action=$(jq -r '.guard_action // "reclaim_only"' config.json)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run session
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes || '345' }}
        run: |
          case "${SESSION_MINUTES}" in
            ''|*[!0-9]*) echo "::error::session_minutes must be an integer"; exit 1 ;;
          esac
          if [ "${SESSION_MINUTES}" -gt 350 ]; then
            echo "session_minutes capped to 350 (job limit is 360)"
            SESSION_MINUTES=350
          fi
          seconds=$(( SESSION_MINUTES * 60 ))
          echo "running for ${SESSION_MINUTES}m (${seconds}s)"
          set +e
          # SIGINT drives the sniper's own signal handler, which stops claimers,
          # flushes sessions, sends the shutdown webhook and exits cleanly.
          timeout --signal=INT --kill-after=90s "${seconds}s" ./sniper -config config.json
          rc=$?
          set -e
          if [ "${rc}" -eq 124 ]; then
            echo "::notice::session window ended after ${SESSION_MINUTES}m; chaining the next session"
            exit 0
          fi
          echo "::error::sniper exited unexpectedly with status ${rc}"
          exit "${rc}"

      - name: Session summary
        if: always()
        run: |
          {
            echo "### Sniper session"
            echo ""
            echo "- config version: ${{ steps.config.outputs.version || 'not loaded' }}"
            echo "- window: ${{ inputs.session_minutes || '345' }}m"
            echo "- runner: ${RUNNER_NAME} (GitHub-hosted, ephemeral)"
            echo ""
            echo "Config came from Supabase. This is a chained session, not an"
            echo "always-on host: expect a gap between sessions and a cold"
            echo "warm-pool/gateway on every start."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Chain next session
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF: run-sniper.yml
          REF: ${{ github.ref_name }}
        run: |
          # The cron watchdog can queue a run while this session is still
          # active. Dispatch a successor only when the queue is empty, so the
          # chain and the watchdog cannot accumulate duplicate pending jobs.
          queued=$(gh api "repos/${GH_REPO}/actions/workflows/${WF}/runs?status=queued" --jq '.total_count')
          if [ "${queued:-0}" -gt 0 ]; then
            echo "::notice::a successor is already queued (${queued}); not dispatching another"
            exit 0
          fi
          gh workflow run "${WF}" --repo "${GH_REPO}" --ref "${REF}" \
            -f session_minutes=345
          echo "dispatched the next session"

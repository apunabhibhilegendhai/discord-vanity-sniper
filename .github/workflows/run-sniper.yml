name: Run sniper (Actions-hosted)

# GitHub Actions cannot host a 24/7 daemon: a GitHub-hosted job is capped at
# 6 hours and its VM is destroyed at the end. This workflow therefore runs a
# bounded session and dispatches its own successor before exiting, so the
# sniper keeps running as a chain of sessions instead of one long process.
#
# That chain is not equivalent to systemd on an always-on host:
#   - every session is a fresh VM, so warm TLS pools and the gateway sequence
#     are rebuilt from scratch;
#   - there is a gap between sessions while the new job queues and arms;
#   - two runs never overlap (concurrency group), but a queued run can be
#     delayed under load.
# For a true always-on sniper use deploy-sniper.yml on a `sniper-host` runner.

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Minutes to run before chaining the next session (max 350)"
        required: false
        default: "345"
  schedule:
    # Watchdog: starts a session every 6 hours if the chain ever breaks.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  # One session at a time. The successor is dispatched just before this job
  # exits, so it waits here instead of racing the running sniper.
  group: sniper-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write # required to dispatch the next session
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build sniper
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ./sniper .
          ./sniper -h >/dev/null 2>&1 || true
          ls -l ./sniper

      - name: Materialize config
        env:
          # Preferred: the complete config document, used verbatim so proxies,
          # guard settings and burst tuning survive. Falls back to the same
          # per-secret shape the old live-test workflow used.
          SNIPER_CONFIG_JSON: ${{ secrets.SNIPER_CONFIG_JSON }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          VANITY: ${{ secrets.VANITY }}
          TOKEN: ${{ secrets.TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          umask 077
          if [ -n "${SNIPER_CONFIG_JSON}" ]; then
            printf '%s' "${SNIPER_CONFIG_JSON}" > config.json
            source="SNIPER_CONFIG_JSON"
          elif [ -n "${GUILD_ID}" ] && [ -n "${VANITY}" ] && \
               { [ -n "${TOKEN}" ] || { [ -n "${EMAIL}" ] && [ -n "${PASSWORD}" ]; }; }; then
            # jq -n keeps values out of the document text, so a password
            # containing quotes or backslashes cannot corrupt the JSON.
            jq -n \
              --arg webhook "${WEBHOOK_URL}" \
              --arg totp "${TOTP_SECRET}" \
              --arg password "${PASSWORD}" \
              --arg email "${EMAIL}" \
              --arg guild "${GUILD_ID}" \
              --arg vanity "${VANITY}" \
              --arg token "${TOKEN}" \
              '{webhook_url:$webhook, totp_secret:$totp, password:$password,
                email:$email, backup_codes:[], burst_count:1,
                warm_connections:1, session_path:"session_state.json",
                guard_mode:false,
                targets:[{guild_id:$guild, vanity:$vanity, token:$token,
                          password:$password, proxies:[""]}],
                browser:"firefox"}' > config.json
            source="repository secrets"
          else
            echo "::error::No sniper credentials. Add repository secrets: either SNIPER_CONFIG_JSON (the whole config document) or GUILD_ID + VANITY plus TOKEN or EMAIL/PASSWORD."
            exit 1
          fi
          chmod 0600 config.json
          if ! jq -e 'type == "object" and has("targets") and (.targets | type == "array") and (.targets | length > 0)' config.json >/dev/null; then
            echo "::error::config from ${source} must be a JSON object with a non-empty targets array."
            exit 1
          fi
          # Never echo secret values. Only non-secret shape is logged.
          echo "config from ${source}: $(jq -r '.targets | length' config.json) target(s), burst_count=$(jq -r '.burst_count // 5' config.json), guard_mode=$(jq -r '.guard_mode // false' config.json)"
          jq -r '.targets[] | "target discord.gg/\(.vanity) guild=\(.guild_id) token=\(if .token == "" then "mint-on-start" else "present" end)"' config.json

      - name: Run session
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes || '345' }}
        run: |
          case "${SESSION_MINUTES}" in
            ''|*[!0-9]*) echo "::error::session_minutes must be an integer"; exit 1 ;;
          esac
          if [ "${SESSION_MINUTES}" -gt 350 ]; then
            echo "session_minutes capped to 350 (job limit is 360)"
            SESSION_MINUTES=350
          fi
          seconds=$(( SESSION_MINUTES * 60 ))
          echo "running for ${SESSION_MINUTES}m (${seconds}s)"
          set +e
          # SIGINT drives the sniper's own signal handler, which stops claimers,
          # flushes sessions, sends the shutdown webhook and exits cleanly.
          timeout --signal=INT --kill-after=90s "${seconds}s" ./sniper -config config.json
          rc=$?
          set -e
          if [ "${rc}" -eq 124 ]; then
            echo "::notice::session window ended after ${SESSION_MINUTES}m; chaining the next session"
            echo "SESSION_ENDED=1" >> "${GITHUB_ENV}"
            exit 0
          fi
          echo "::error::sniper exited unexpectedly with status ${rc}"
          exit "${rc}"

      - name: Session summary
        if: always()
        run: |
          {
            echo "### Sniper session"
            echo ""
            echo "- runner: ${RUNNER_NAME}"
            echo "- duration window: ${{ inputs.session_minutes || '345' }}m"
            echo "- host: GitHub-hosted (ephemeral VM)"
            echo ""
            echo "This is a chained session, not an always-on host. Expect a gap"
            echo "between sessions and a cold warm-pool/gateway on every start."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Chain next session
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF: run-sniper.yml
          REF: ${{ github.ref_name }}
        run: |
          # The cron watchdog can queue a run while this session is still
          # active. Dispatch a successor only when the queue is empty, so the
          # chain and the watchdog cannot accumulate duplicate pending jobs.
          queued=$(gh api "repos/${GH_REPO}/actions/workflows/${WF}/runs?status=queued" --jq '.total_count')
          if [ "${queued:-0}" -gt 0 ]; then
            echo "::notice::a successor is already queued (${queued}); not dispatching another"
            exit 0
          fi
          gh workflow run "${WF}" --repo "${GH_REPO}" --ref "${REF}" \
            -f session_minutes=345
          echo "dispatched the next session"
